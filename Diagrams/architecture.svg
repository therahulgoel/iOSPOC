<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Verdana, Arial, Helvetica, sans-serif" font-size="12" fill="#111">
    <g transform="translate(40,20)">
      <text x="0" y="14" font-weight="bold">Frontend</text>
      <rect x="0" y="20" width="220" height="120" rx="8" fill="#f0f8ff" stroke="#bbb"/>
      <text x="12" y="44">Mobile App</text>
      <text x="12" y="60" font-size="11" fill="#333">(React Native)</text>
      <text x="12" y="94">Web App</text>
      <text x="12" y="110" font-size="11" fill="#333">(React)</text>
    </g>

    <g transform="translate(320,20)">
      <text x="0" y="14" font-weight="bold">API Gateway / Load Balancer</text>
      <rect x="0" y="20" width="260" height="40" rx="6" fill="#fff0ff" stroke="#c0a0d0"/>
    </g>

    <g transform="translate(320,90)">
      <text x="0" y="14" font-weight="bold">Backend</text>
      <rect x="-10" y="20" width="640" height="360" rx="8" fill="#f8f8ff" stroke="#ccc"/>
      <!-- API -->
      <rect x="16" y="48" width="120" height="36" rx="6" fill="#fff0ff" stroke="#c0a0d0"/>
      <text x="30" y="72">API</text>
      <!-- Auth -->
      <rect x="160" y="48" width="140" height="56" rx="6" fill="#e8fff0" stroke="#90cfa0"/>
      <text x="176" y="68">Auth Service</text>
      <text x="176" y="84" font-size="11">OAuth2 / JWT</text>
      <!-- Wishlist -->
      <rect x="320" y="48" width="140" height="56" rx="6" fill="#ddeeff" stroke="#aac0ff"/>
      <text x="340" y="68">Wishlist Service</text>
      <!-- Notify -->
      <rect x="480" y="48" width="140" height="56" rx="6" fill="#fff6e6" stroke="#f1c070"/>
      <text x="500" y="68">Notification Service</text>
      <!-- Booking -->
      <rect x="160" y="120" width="200" height="56" rx="6" fill="#fff0f0" stroke="#f0a0a0"/>
      <text x="200" y="148">Booking Aggregator</text>

      <!-- DB, Cache, Storage -->
      <ellipse cx="420" cy="220" rx="70" ry="36" fill="#fff7d9" stroke="#dfc870"/>
      <text x="380" y="224">Postgres</text>

      <rect x="520" y="200" width="100" height="48" rx="6" fill="#f0fff6" stroke="#a0d9b0"/>
      <text x="540" y="224">Redis</text>

      <rect x="640" y="200" width="120" height="48" rx="6" fill="#f8f8ff" stroke="#c8c8ff"/>
      <text x="660" y="224">S3 / Object Storage</text>

      <!-- External -->
      <rect x="520" y="280" width="160" height="36" rx="6" fill="#ffffff" stroke="#bbb"/>
      <text x="540" y="302">Third-party Booking APIs</text>

      <rect x="700" y="280" width="160" height="36" rx="6" fill="#ffffff" stroke="#bbb"/>
      <text x="720" y="302">Email / Push Provider</text>

    </g>

    <!-- Users -->
    <g transform="translate(40,220)">
      <text x="0" y="14" font-weight="bold">Users</text>
      <circle cx="40" cy="60" r="22" fill="#fff" stroke="#999"/><text x="22" y="64">Owner</text>
      <circle cx="120" cy="60" r="22" fill="#fff" stroke="#999"/><text x="98" y="64">Friend</text>
      <circle cx="200" cy="60" r="22" fill="#fff" stroke="#999"/><text x="178" y="64">Viewer</text>
    </g>

    <!-- Arrows -->
    <g stroke="#333" stroke-width="1" fill="none" marker-end="url(#arrow)">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path>
        </marker>
      </defs>
      <path d="M160 50 L320 40" />
      <path d="M160 74 L320 58" />
      <path d="M88 180 L320 80" />
      <path d="M200 180 L320 80" />
    </g>
  </g>
</svg>
