<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill: #f5f7fb; stroke: #2b6cb0; stroke-width: 2; rx:10; }
    .title { font: bold 14px sans-serif; fill: #102a43; }
    .label { font: 12px sans-serif; fill: #123; }
    .small { font: 11px sans-serif; fill: #123; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="60" width="200" height="80" class="box"/>
  <text x="140" y="90" text-anchor="middle" class="title">iOS App</text>
  <text x="140" y="110" text-anchor="middle" class="small">Booking Manager (EM)</text>

  <!-- API Gateway -->
  <rect x="300" y="60" width="220" height="80" class="box"/>
  <text x="410" y="90" text-anchor="middle" class="title">API Gateway</text>
  <text x="410" y="110" text-anchor="middle" class="small">Rate-limit, Auth, TLS</text>

  <!-- Services Layer -->
  <rect x="300" y="180" width="240" height="60" class="box"/>
  <text x="420" y="205" text-anchor="middle" class="label">Auth Service</text>

  <rect x="560" y="120" width="240" height="80" class="box"/>
  <text x="680" y="150" text-anchor="middle" class="title">Booking Service</text>
  <text x="680" y="170" text-anchor="middle" class="small">Reservations, Business Logic</text>

  <rect x="560" y="220" width="240" height="80" class="box"/>
  <text x="680" y="250" text-anchor="middle" class="title">Inventory Service</text>
  <text x="680" y="270" text-anchor="middle" class="small">Availability, Calendar</text>

  <rect x="560" y="320" width="240" height="60" class="box"/>
  <text x="680" y="350" text-anchor="middle" class="label">Payment Service</text>

  <rect x="560" y="400" width="240" height="60" class="box"/>
  <text x="680" y="430" text-anchor="middle" class="label">Notification Service</text>

  <rect x="300" y="300" width="220" height="120" class="box"/>
  <text x="410" y="330" text-anchor="middle" class="title">Search Service</text>
  <text x="410" y="350" text-anchor="middle" class="small">Full-text, Filters</text>

  <!-- Data Layer -->
  <rect x="900" y="120" width="240" height="90" class="box"/>
  <text x="1020" y="150" text-anchor="middle" class="title">Primary DB</text>
  <text x="1020" y="170" text-anchor="middle" class="small">Postgres (ACID)</text>

  <rect x="900" y="230" width="240" height="60" class="box"/>
  <text x="1020" y="260" text-anchor="middle" class="label">Cache</text>
  <text x="1020" y="275" text-anchor="middle" class="small">Redis</text>

  <rect x="900" y="320" width="240" height="60" class="box"/>
  <text x="1020" y="350" text-anchor="middle" class="label">Message Queue</text>
  <text x="1020" y="365" text-anchor="middle" class="small">Kafka / PubSub</text>

  <!-- Arrows -->
  <line x1="240" y1="100" x2="300" y2="100" class="arrow" />
  <line x1="520" y1="100" x2="560" y2="160" class="arrow" />

  <line x1="410" y1="140" x2="410" y2="180" class="arrow" />
  <line x1="540" y1="210" x2="560" y2="160" class="arrow" />

  <line x1="800" y1="160" x2="900" y2="160" class="arrow" />
  <line x1="800" y1="240" x2="900" y2="260" class="arrow" />
  <line x1="800" y1="380" x2="900" y2="350" class="arrow" />

  <line x1="720" y1="260" x2="900" y2="260" class="arrow" />
  <line x1="720" y1="160" x2="900" y2="160" class="arrow" />

  <!-- Data writes -->
  <line x1="1020" y1="210" x2="1020" y2="230" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="980" y="200" class="small">Writes / Reads</text>

  <!-- Notes -->
  <rect x="40" y="520" width="1100" height="220" fill="#fff7e6" stroke="#d69e2e" rx="8" />
  <text x="100" y="550" class="title">Design Notes / Talking Points</text>
  <text x="100" y="575" class="small">- Consistency: use transactions in Booking Service; optimistic locking for availability.</text>
  <text x="100" y="595" class="small">- Availability: pre-book hold using cache + background reconciliation via MQ.</text>
  <text x="100" y="615" class="small">- Payments: external provider integration, idempotency keys.</text>
  <text x="100" y="635" class="small">- Scaling: stateless services behind autoscaling; DB read replicas.</text>
  <text x="100" y="655" class="small">- Observability: request tracing, SLOs (latency, availability), capacity planning.</text>

</svg>