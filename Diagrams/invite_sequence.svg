<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Verdana, Arial, Helvetica, sans-serif" font-size="12" fill="#111">
    <text x="20" y="20" font-weight="bold">Sequence: Invite → Accept → Add Hotel</text>

    <!-- Participants -->
    <g transform="translate(20,40)" font-size="12">
      <text x="0" y="0">Owner</text>
      <rect x="0" y="6" width="120" height="260" rx="4" fill="#f7f7ff" stroke="#bbb"/>
      <text x="160" y="0">System</text>
      <rect x="160" y="6" width="140" height="260" rx="4" fill="#fff7f2" stroke="#bbb"/>
      <text x="340" y="0">Invitee</text>
      <rect x="340" y="6" width="120" height="260" rx="4" fill="#f6fff6" stroke="#bbb"/>
      <text x="500" y="0">Auth</text>
      <rect x="500" y="6" width="100" height="260" rx="4" fill="#f0fff6" stroke="#bbb"/>
      <text x="620" y="0">DB</text>
      <rect x="620" y="6" width="140" height="260" rx="4" fill="#fffaf0" stroke="#bbb"/>
    </g>

    <!-- Messages as arrows -->
    <g stroke="#333" stroke-width="1" fill="none" marker-end="url(#arrow2)">
      <defs>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path>
        </marker>
      </defs>

      <!-- Create wishlist -->
      <path d="M80 90 L320 90" />
      <text x="120" y="82" font-size="11">Create wishlist (title, dates, privacy)</text>
      <path d="M320 110 L690 110" />
      <text x="360" y="102" font-size="11">Save wishlist</text>

      <!-- Invite friend -->
      <path d="M80 150 L320 150" />
      <text x="120" y="142" font-size="11">Invite friend (email/username)</text>
      <path d="M320 170 L440 170" />
      <text x="360" y="162" font-size="11">Send invite email w/ token</text>

      <!-- Accept invite -->
      <path d="M440 210 L520 210" />
      <text x="460" y="204" font-size="11">Click link → Login/Register</text>
      <path d="M520 230 L690 230" />
      <text x="540" y="222" font-size="11">Create/verify user</text>
      <path d="M440 250 L320 250" />
      <text x="360" y="242" font-size="11">Accept invite (token)</text>
      <path d="M320 270 L690 270" />
      <text x="360" y="262" font-size="11">Add WishlistMember (role=contributor)</text>

      <!-- Add hotel -->
      <path d="M440 310 L320 310" />
      <text x="360" y="302" font-size="11">Add hotel item (title, link, dates, notes)</text>
      <path d="M320 330 L690 330" />
      <text x="360" y="322" font-size="11">Save item with creator_id</text>

    </g>

    <g transform="translate(0,0)">
      <defs>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"></path>
        </marker>
      </defs>
    </g>

  </g>
</svg>
